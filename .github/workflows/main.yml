name: Main

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test_hugo:
    name: Build and test Hugo
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.160.0'

      - name: Build
        run: |
          hugo --minify
          touch ./public/.nojekyll

      - name: Test if index file exists
        run: |
          test -f ./public/index.html || (echo 'Error: index.html was not generated by Hugo build' && exit 1)

  test_nginx_config:
    name: Test nginx config
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: nginx:1.31.0-alpine@sha256:c22e76a97fe5bacad9d58bad0a96e903480c05f8dee30884b14550530ddd25a9
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate and validate nginx config
        run: |
          cp nginx.conf /etc/nginx/conf.d/default.conf
          nginx -t

  lint_dockerfile:
    name: Lint Dockerfile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387

  build_dockerfile:
    name: Build Docker image
    needs: test_hugo
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false

  publish:
    name: Publish Release and Docker image
    needs:
      - test_nginx_config
      - lint_dockerfile
      - build_dockerfile
    permissions:
      contents: write
      packages: write
      issues: write
    outputs:
      new_release_published: ${{ steps.publish_release.outputs.new_release_published }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Publish Release and Docker image
        id: publish_release
        uses: ffflorian/actions/docker-image-release@b49e8f5432fa2d10d8f64efaa8bc33977c26123e
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          git_author: 'ffflorian'
          git_email: 'git@ffflorian.de'

  # semantic-release pushes the version tag before it creates the GitHub release
  # and before the Docker image is pushed. If the publish job fails after the
  # tag was pushed, re-runs find no new commits and never publish the image.
  # This job publishes the image for the latest version tag if it is missing.
  recover_release:
    name: Publish missing Docker image
    needs: publish
    permissions:
      contents: read
      packages: write
    outputs:
      image_published: ${{ steps.build.outputs.image_published }}
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.publish.result == 'failure' || (needs.publish.result == 'success' && needs.publish.outputs.new_release_published != 'true'))
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for missing image
        id: check
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=$(git rev-list -n 1 "${tag}")"
          } >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${IMAGE_NAME}:${version}" > /dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${version} exists, nothing to recover"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image ${IMAGE_NAME}:${version} is missing"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release tag
        if: steps.check.outputs.missing == 'true'
        run: git checkout "${{ steps.check.outputs.tag }}"

      - name: Extract Docker metadata
        if: steps.check.outputs.missing == 'true'
        id: docker-meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        if: steps.check.outputs.missing == 'true'
        id: build
        env:
          LABELS: ${{ steps.docker-meta.outputs.labels }}
          VERSION: ${{ steps.check.outputs.version }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          label_args=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            label_args+=(--label "$label")
          done <<< "${LABELS}"

          docker buildx build \
            --push \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            "${label_args[@]}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "COMMIT=${COMMIT}" \
            .
          echo "image_published=true" >> "$GITHUB_OUTPUT"

  # Deploy is part of this workflow because GitHub does not fire release events
  # when a release is created by a workflow using GITHUB_TOKEN, so a separate
  # deploy.yml listening on release:published would never be triggered.
  deploy:
    name: Deploy latest image
    needs:
      - publish
      - recover_release
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.publish.result == 'success' && needs.publish.outputs.new_release_published == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (needs.recover_release.result == 'success' && needs.recover_release.outputs.image_published == 'true')
      )
    steps:
      - name: Deploy
        uses: ffflorian/actions/coolify-deploy@b49e8f5432fa2d10d8f64efaa8bc33977c26123e
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          domain: ${{ secrets.COOLIFY_DOMAIN }}
          token: ${{ secrets.COOLIFY_TOKEN }}
          uuid: ${{ secrets.COOLIFY_UUID }}
