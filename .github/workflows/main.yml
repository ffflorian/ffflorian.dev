name: Main

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test_hugo:
    name: Build and test Hugo
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.160.0'

      - name: Build
        run: |
          hugo --minify
          touch ./public/.nojekyll

      - name: Test if index file exists
        run: |
          test -f ./public/index.html || (echo 'Error: index.html was not generated by Hugo build' && exit 1)

  test_nginx_config:
    name: Test nginx config
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: nginx:1.31.0-alpine@sha256:c22e76a97fe5bacad9d58bad0a96e903480c05f8dee30884b14550530ddd25a9
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Generate and validate nginx config
        run: |
          cp nginx.conf /etc/nginx/conf.d/default.conf
          nginx -t

  lint_dockerfile:
    name: Lint Dockerfile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0

  build_dockerfile:
    name: Build Docker image
    needs: test_hugo
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false

  publish:
    name: Publish Release and Docker image
    needs:
      - test_nginx_config
      - lint_dockerfile
      - build_dockerfile
    permissions:
      contents: write
      packages: write
      issues: write
    outputs:
      new_release_published: ${{ steps.publish_release.outputs.new_release_published }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Publish Release and Docker image
        id: publish_release
        uses: ffflorian/actions/docker-image-release@v1.30.10
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          git_author: 'Florian Imdahl'
          git_email: 'git@ffflorian.de'

  # semantic-release pushes the version tag before it creates the GitHub release
  # and before the Docker image is pushed. If the publish job fails after the
  # tag was pushed, re-runs find no new commits and never publish the release.
  # This job creates the GitHub release and publishes the image for the latest
  # version tag if they are missing.
  recover_release:
    name: Publish missing release and Docker image
    needs: publish
    permissions:
      contents: write
      packages: write
    outputs:
      image_published: ${{ steps.build.outputs.image_published }}
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.publish.result == 'failure' || (needs.publish.result == 'success' && needs.publish.outputs.new_release_published != 'true'))
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for missing image
        id: check
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=$(git rev-list -n 1 "${tag}")"
          } >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${IMAGE_NAME}:${version}" > /dev/null 2>&1; then
            echo "Image ${IMAGE_NAME}:${version} exists, nothing to recover"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image ${IMAGE_NAME}:${version} is missing"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create missing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists"
            exit 0
          fi
          # semantic-release writes the release notes to CHANGELOG.md in the release commit
          git show "${TAG}:CHANGELOG.md" | awk -v version="${VERSION}" '
            /^##? / { if (found) exit; found = ($2 == version || index($2, "[" version "]") == 1) }
            found { print }
          ' > "${RUNNER_TEMP}/notes.md"
          if [ -s "${RUNNER_TEMP}/notes.md" ]; then
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
          fi

      - name: Check out release tag
        if: steps.check.outputs.missing == 'true'
        run: git checkout "${{ steps.check.outputs.tag }}"

      - name: Extract Docker metadata
        if: steps.check.outputs.missing == 'true'
        id: docker-meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        if: steps.check.outputs.missing == 'true'
        id: build
        env:
          LABELS: ${{ steps.docker-meta.outputs.labels }}
          VERSION: ${{ steps.check.outputs.version }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          label_args=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            label_args+=(--label "$label")
          done <<< "${LABELS}"

          docker buildx build \
            --push \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            "${label_args[@]}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "COMMIT=${COMMIT}" \
            .
          echo "image_published=true" >> "$GITHUB_OUTPUT"

  # Deploy is part of this workflow because GitHub does not fire release events
  # when a release is created by a workflow using GITHUB_TOKEN, so a separate
  # deploy.yml listening on release:published would never be triggered.
  deploy:
    name: Deploy latest image
    needs:
      - publish
      - recover_release
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.publish.result == 'success' && needs.publish.outputs.new_release_published == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (needs.recover_release.result == 'success' && needs.recover_release.outputs.image_published == 'true')
      )
    steps:
      - name: Deploy
        uses: ffflorian/actions/coolify-deploy@v1.30.10
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          domain: ${{ secrets.COOLIFY_DOMAIN }}
          token: ${{ secrets.COOLIFY_TOKEN }}
          uuid: ${{ secrets.COOLIFY_UUID }}
