map $uri $cache_control {
  ~^/css/                                  "public, max-age=31536000, immutable";
  ~\.(?:jpg|jpeg|png|webp|svg|ico)$        "public, max-age=604800";
  default                                  "no-cache";
}

server {
  listen 8080;
  server_tokens off;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml image/x-icon text/plain;

  add_header Cache-Control $cache_control always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ =404;
  }
}
